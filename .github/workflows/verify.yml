# Runs the tests and the shell check on every push.
#
# This is not ceremony. The precache list in sw.js is hand written,
# and a wrong filename there means the service worker install fails
# and every client silently stays on the old version. That happened
# repeatedly between v168 and v174, and nothing caught it until a
# user reported seeing an old screen.
#
# check-shell.js fails on both directions: an entry with no file on
# disk, and a shipped asset with no cache entry.
#
# node:test is built into Node, so there is nothing to install. That
# is also why there is deliberately no package.json in this repo -
# Cloudflare Pages sees one, decides this is a Node project, tries to
# run a build against a project that has none, and every deploy fails.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    # ⭐ مثبّت مش latest: GitHub بيحوّل ubuntu-latest لـUbuntu 26،
    # والـrunners тогда مش مضمون. التثبيت بيخلّي البناء مستقر.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # ⭐ عمق 2 مش 1: فحص «رقم الكاش بيتحرّك مع الملفات» بيقارن
          # الـcommit الحالي باللي قبله، فلو الـclone shallow بيبقى
          # مفيش HEAD~1 والفحص بيتخطّى من غير ما يكتشف حاجة.
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          # ⭐ Node 20 خلص عمره (EOL أبريل 2026) وv4/v5 من الـactions
          # بيستهدفوا Node runtime قديم. Node 24 هوCurrent.
          node-version: '24'

      - name: Unit tests
        # بلا علامات تنصيص عمداً: bash لازم يوسّع الـglob بنفسه.
        # مقصوصة، النص بيوصل حرفياً وNode بيقول "Could not find".
        run: node --test tests/*.test.js

      - name: Shell precache check
        run: node scripts/check-shell.js

      - name: Workflow syntax check
        run: node scripts/check-workflow.js

      - name: Dead CSS check
        # ⭐ بيقول إيه الـCSS الميت اللي لسه في المصدر من غير ما
        # يغير حاجة — تنبيه فقط. التنظيف الفعلي بـ--apply.
        run: node scripts/css-prune.js