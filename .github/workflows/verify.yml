/* Runs the tests and the shell check on every push.
 *
 * This is not ceremony. The precache list in sw.js is hand written,
 * and a wrong filename there means the service worker install fails
 * and every client silently stays on the old version. That happened
 * repeatedly between v168 and v174, and nothing caught it until a
 * user reported seeing an old screen.
 *
 * check-shell.js fails on both directions: an entry with no file, and
 * a shipped asset with no cache entry.
 *
 * node:test is built into Node, so there is nothing to install. */
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests
        run: node --test "tests/*.test.js"

      - name: Shell precache check
        run: node scripts/check-shell.js