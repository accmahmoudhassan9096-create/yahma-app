<?xml version="1.0" encoding="UTF-8"?>
<!--
  assets/app-icon.svg — أيقونة التطبيق (PWA).

  فرقها عن logo-mark.svg:
    - الخلفية كاملة (من غير زوايا مدوّرة) — لأن أندرويد/iOS بيقصّوا
      الأيقونة بأنفسهم (maskable).
    - المارك مصغّر ومزحزح في «منطقة الأمان» (80% الوسطى) عشان
      ما يتقصّش على أي شكل تقني.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="يهماء لتأجير السيارات">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173553"/>
      <stop offset=".55" stop-color="#0E2238"/>
      <stop offset="1" stop-color="#081523"/>
    </linearGradient>
    <radialGradient id="iconAurora" cx=".78" cy=".08" r=".72">
      <stop offset="0" stop-color="#17AAA4" stop-opacity=".42"/>
      <stop offset=".45" stop-color="#17AAA4" stop-opacity=".10"/>
      <stop offset="1" stop-color="#17AAA4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconGold" gradientUnits="userSpaceOnUse" x1="150" y1="110" x2="362" y2="400">
      <stop offset="0" stop-color="#F4DFAC"/>
      <stop offset=".42" stop-color="#DCB56A"/>
      <stop offset="1" stop-color="#B3853A"/>
    </linearGradient>
    <radialGradient id="iconGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E0BC74" stop-opacity=".26"/>
      <stop offset="1" stop-color="#E0BC74" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#iconBg)"/>
  <rect width="512" height="512" fill="url(#iconAurora)"/>

  <!-- المارك في منطقة الأمان (80% الوسطى) -->
  <g transform="translate(256 262) scale(0.74) translate(-256 -250)">
    <circle cx="256" cy="212" r="124" fill="url(#iconGlow)"/>
    <path d="M135.6 339.7 A142 142 0 1 1 376.4 339.7" fill="none" stroke="url(#iconGold)" stroke-width="13" stroke-linecap="round" opacity=".92"/>
    <path d="M202 166 L256 232 L310 166" fill="none" stroke="url(#iconGold)" stroke-width="35" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 232 L256 302" fill="none" stroke="url(#iconGold)" stroke-width="35" stroke-linecap="round"/>
    <g fill="#17AAA4">
      <rect x="244" y="324" width="24" height="11" rx="5.5" opacity=".95"/>
      <rect x="238" y="352" width="36" height="14" rx="7" opacity=".7"/>
      <rect x="230" y="386" width="52" height="18" rx="9" opacity=".45"/>
    </g>
  </g>
</svg>
