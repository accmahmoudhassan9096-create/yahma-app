<?xml version="1.0" encoding="UTF-8"?>
<!--
  assets/hero-car.svg — silhouette سيارة منظر جانبي نقي.

  ⭐ بيتستخدم كـmask في CSS، فبيتلوّن بلون الـbackground في كل حالة:
     فاتح = أزرق فاتح هادئ، غامق = تركوازي على الكارت الأخضر.

  التوزيع (1400×440) — المهم فيه خط الكتف الأفقي (y≈250)، هو اللي
  بيخلّي الشكل يقرأ كسيارة: الكول والكبوت أفقيّين، والزجاج فوقهم.
    · الذيل 140 — صدّام خلفي
    · كول (صندوق) 160→288 على خط y≈252
    · زجاج خلفي 318→448
    · سقف 448→700
    · زجاج أمامي 700→866
    · كبوت 866→1090 على خط y≈252
    · صادم أمامي 1190
    · العجلات r=56 على y=324، مركزاهما 320 و1040
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440" width="1400" height="440" role="img" aria-label="صورة سيارة جانبية">
  <defs>
    <radialGradient id="sh" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#000" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ظل أرضي ناعم -->
  <ellipse cx="660" cy="386" rx="545" ry="22" fill="url(#sh)"/>

  <!-- جسم السيارة -->
  <path fill="#000" d="M140 324
    C138 300 142 282 156 272
    C168 262 186 258 210 256
    L288 250
    C300 248 310 244 318 234
    L372 172
    C392 140 412 116 448 108
    L700 102
    C740 106 760 124 776 150
    L866 238
    C876 246 888 250 906 252
    L1090 262
    C1140 266 1172 282 1182 306
    L1190 324
    L1096 324
    A56 56 0 0 0 984 324
    L376 324
    A56 56 0 0 0 264 324
    L140 324 Z"/>

  <!-- زجاج: النافذة الخلفية -->
  <path fill="#000" opacity=".40" d="M372 238
    L404 168
    C420 142 436 130 462 128
    L556 124
    L552 238 Z"/>

  <!-- زجاج: النافذة الأمامية -->
  <path fill="#000" opacity=".40" d="M566 124
    L686 122
    C712 121 726 130 738 150
    L806 236
    L562 236 Z"/>

  <!-- لمعة على خط الكتف (الكول والكبوت) -->
  <path fill="#000" opacity=".24" d="M186 268
    C420 262 700 258 1120 278
    L1120 288
    C700 268 420 272 186 278 Z"/>

  <!-- العجلات -->
  <circle cx="320" cy="324" r="56" fill="#000"/>
  <circle cx="320" cy="324" r="24" fill="#000" opacity=".45"/>
  <circle cx="1040" cy="324" r="56" fill="#000"/>
  <circle cx="1040" cy="324" r="24" fill="#000" opacity=".45"/>
</svg>
